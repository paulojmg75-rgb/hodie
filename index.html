<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hodie · aplicações para professores</title>
<meta name="description" content="Hodie: planificação semanal e agenda do professor. Os dados ficam na Drive de cada professor.">
<link rel="icon" href="planificacao/icon-192.png">
<style>
:root{--ink:#16202e;--muted:#5a6676;--bg:#f3f6f9;--card:#fff;--line:#d9e0e8;--blue:#023870;--green:#14a33d;--purple:#6b3fa0}
@media (prefers-color-scheme:dark){:root{--ink:#e8edf4;--muted:#9fadc0;--bg:#0f1622;--card:#172131;--line:#2b3a50}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 16px}
h1{font-size:44px;margin:0;letter-spacing:-.02em;color:var(--blue)}h1 span{color:var(--green)}
@media (prefers-color-scheme:dark){h1{color:#8db5ef}}
p.sub{color:var(--muted);margin:6px 0 34px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:100%;max-width:640px}
a.card{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:inherit;box-shadow:0 8px 24px -16px rgba(0,0,0,.4);transition:transform .15s}
a.card:hover{transform:translateY(-2px)}
.ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;flex:none}
a.card b{font-size:18px;display:block}a.card small{color:var(--muted)}
footer{margin-top:auto;padding-top:40px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<h1>hod<span>ie</span></h1>
<p class="sub">Aplicações para professores</p>
<div class="grid">
<a class="card" href="planificacao/"><span class="ic" style="background:var(--blue)">P</span><span><b>Planificação</b><small>Planificação semanal, Word e PDF</small></span></a>
<a class="card" href="agenda/"><span class="ic" style="background:var(--purple)">G</span><span><b>Agenda</b><small>Calendário, horário, tarefas e lembretes</small></span></a>
</div>
<footer>Os dados ficam no teu aparelho e na tua Google Drive.</footer>
</body>
</html>
